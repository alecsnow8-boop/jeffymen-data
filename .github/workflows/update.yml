name: Update league data

on:
  schedule:
    - cron: "0 12 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/build.mjs
      - name: Commit data when it changed
        run: |
          git config user.name "jeffymen-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)" && git push; fi
